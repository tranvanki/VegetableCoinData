name: hhmmobile
description: Ứng dụng mobile Hoàng Hà Mobile (HHM26) - Flutter client cho nền tảng TMĐT HHM.
publish_to: 'none'

# <version>+<build>. CI truyền --build-name/--build-number khi phát hành.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

 
  # --- State / DI / Routing ---------------------------------------------
  provider: ^6.1.2            # MVVM ChangeNotifier, giống gs24_gps
  get_it: ^8.0.2              # Service locator, thay cho static class
  go_router: ^14.6.1          # Deep link + route guard

  # --- Network -----------------------------------------------------------
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.1.0

  # --- Storage -----------------------------------------------------------
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2

  # --- UI ----------------------------------------------------------------
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  favorite_button: ^0.0.3
  shimmer: ^3.0.0
  photo_view: ^0.15.0
  webview_flutter: ^4.10.0

  # --- i18n / format -----------------------------------------------------
  intl: any
  localization: ^2.1.1        # i18n JSON, giống gs24_gps

  # --- Platform ----------------------------------------------------------
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  url_launcher: ^6.3.1
  share_plus: ^11.0.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  app_links: ^6.3.2

  # --- Push --------------------------------------------------------------
  onesignal_flutter: ^5.2.9
  flutter_appauth: ^12.1.0
  footer: ^0.0.4
  flutter_image_cache: ^1.0.3
  simple_timer_count_down: ^1.0.7
  firebase_core: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  # Sinh icon launcher cho Android/iOS từ asset/icons/. Chạy lại sau mỗi lần
  # đổi logo: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

# Nguồn icon: logo chữ H của Hoàng Hà Mobile, ĐÃ CẮT BỎ dòng chữ
# "HOANGHAMOBILE.COM" — ở cỡ 48dp dòng chữ chỉ còn là vệt mờ.
# Bản logo đầy đủ giữ ở asset/icons/app_logo_full.png để dùng cho splash/khác.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "asset/icons/app_icon.png"
  min_sdk_android: 21
  # Adaptive icon (Android 8+): hệ thống tự bo theo hình dạng của máy, chỉ phần
  # giữa ~61% là vùng an toàn — vì vậy foreground để logo nhỏ hơn bản thường.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "asset/icons/app_icon_foreground.png"
  # App Store từ chối icon có kênh alpha.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - asset/icons/
    - asset/images/
    - lib/i18n/
    - env/dev.json
